; ============================================================================
; Switchboard Viewport — firmware for the Seeed reTerminal E1002
; (7.3" Spectra 6 colour e-paper, ESP32-S3, 8 MB PSRAM)
;
; A wall display for Switchboard: it pairs with Switchboard Server, pulls
; its layout, theme and every screen's values from there, draws them, and
; sleeps until the server says to wake.
;
;   pio run -e e1002 -t upload -t monitor
;
; The board, the display and the partitions are the ones the kitchen
; panel this grew from was proven on.
; ============================================================================

[platformio]
default_envs = e1002

[env:e1002]
; The same platform the panel was proven on (Arduino-ESP32 2.x).
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
; The cache (layout, screens, icons, theme packs) lives on the flash, so it
; works without an SD card.
board_build.filesystem = littlefs

; FIRMWARE_VERSION from git (tools/gen_version.py).
extra_scripts = pre:tools/gen_version.py

; The core builds as C++11 by default; this firmware is C++17 (GCC 8.4 has it).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; The board this build is for, as Switchboard Server's updates know it.
    '-DSWITCHBOARD_BOARD="e1002"'
    -DARDUINOJSON_ENABLE_PROGMEM=1
    ; The bundle carries the whole layout: screens > columns > sections >
    ; status icons > rules > "also" is 12 levels, past ArduinoJson's default
    ; of 10 (it refuses it as TooDeep).
    -DARDUINOJSON_DEFAULT_NESTING_LIMIT=32
    -Isrc

lib_deps =
    zinggjm/GxEPD2 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    sensirion/Sensirion I2C SHT4x @ ^1.1.0
    sensirion/Sensirion Core @ ^0.7.1
    bblanchon/ArduinoJson @ ^7.1.0
