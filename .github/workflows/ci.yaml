name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # The firmware for the reTerminal E1002.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe (tools/gen_version.py)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build (e1002)
        run: pio run -e e1002

      - name: The image says what it is
        run: grep -a -q "SWITCHBOARD_FW:e1002:" .pio/build/e1002/firmware.bin

  # The logic and the drawing, built with g++ and run here; every screen in
  # test/fixtures rendered to an image (kept as an artifact to look at).
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pillow (PNG output)
        run: pip install pillow

      - name: Host tests
        run: ./test/host/run.sh

      # The original kitchen panel firmware and this one + the server, on
      # the same captured Home Assistant: every screen must match exactly.
      - name: Matches the kitchen panel pixel for pixel
        run: ./test/compare/compare.sh

      # The same on many houses (an alarm going off, sensors gone, a frost,
      # midnight...), with Switchboard Server computing each one.
      - uses: actions/checkout@v4
        with:
          repository: stumarti/Switchboard-Server
          ref: ${{ github.head_ref || github.ref_name }}
          path: server
        continue-on-error: true
        id: server-same-branch
      - uses: actions/checkout@v4
        if: steps.server-same-branch.outcome != 'success'
        with:
          repository: stumarti/Switchboard-Server
          path: server
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Matches it on every scenario
        run: |
          (cd server && npm ci --omit=dev)
          SERVER_DIR=server node test/compare/scenarios.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: |
            test/host/out/
            test/compare/out/
